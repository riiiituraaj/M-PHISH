name: m-phish-local
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mphish
      POSTGRES_USER: mphish
      POSTGRES_PASSWORD: local-development-only
    volumes: ["database:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mphish"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["queue:/data"]
  migrate:
    build: {context: ., dockerfile: backend/Dockerfile}
    command: ["python", "-m", "alembic", "-c", "backend/alembic.ini", "upgrade", "head"]
    environment: &local
      DATABASE_URL: postgresql+psycopg://mphish:local-development-only@db/mphish
      REDIS_URL: redis://redis:6379/0
      APP_ENV: development
    depends_on:
      db: {condition: service_healthy}
  api:
    build: {context: ., dockerfile: backend/Dockerfile}
    environment: *local
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
  dispatcher:
    build: {context: ., dockerfile: backend/Dockerfile}
    environment: *local
    command: ["python", "-m", "backend.app.jobs"]
    healthcheck: {disable: true}
    depends_on:
      migrate: {condition: service_completed_successfully}
  worker:
    build: {context: ., dockerfile: backend/Dockerfile}
    environment: *local
    command: ["rq", "worker", "--url", "redis://redis:6379/0", "--with-scheduler", "investigations"]
    healthcheck: {disable: true}
    depends_on:
      migrate: {condition: service_completed_successfully}
  web:
    build: {context: web, dockerfile: Dockerfile}
    ports: ["127.0.0.1:3000:3000"]
volumes:
  database:
  queue:
